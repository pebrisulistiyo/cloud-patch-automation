name: terraform-ci

on:
  pull_request:
    paths: ["aws/**", "gcp/**", ".github/workflows/terraform-ci.yml"]
  push:
    branches: [main]
    paths: ["aws/**", "gcp/**", ".github/workflows/terraform-ci.yml"]
  workflow_dispatch:
    inputs:
      command:
        description: "GCP terraform command to run (GCP is code-first; jobs run once the GCP variables exist)"
        required: true
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  id-token: write # OIDC to AWS
  contents: read
  pull-requests: write

jobs:
  # --- Static checks: no cloud credentials needed ---------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --chdir=aws
          tflint --chdir=gcp
      - uses: raven-actions/actionlint@v2

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [aws, gcp]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: terraform validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  # --- AWS plan: PR-only, read-only role ------------------------------------
  plan-aws:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform plan
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -input=false
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync("aws/plan.txt", "utf8");
            const body = "### Terraform plan (aws)\n\n```hcl\n" +
              plan.slice(0, 30000) + "\n```";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # --- AWS apply: main only, apply role ------------------------------------
  apply-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform apply
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -input=false
          terraform apply -auto-approve -input=false

  # --- GCP: code-first. Jobs self-skip until the GCP variables exist. -------
  # When the GCP account arrives: set GCP_PROJECT_ID / GCP_WIF_PROVIDER /
  # GCP_WIF_SA / GCP_STATE_BUCKET (repository variables) and these jobs light
  # up. See docs/gcp-patching.md.
  gcp:
    if: github.event_name == 'workflow_dispatch' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
      - name: terraform ${{ inputs.command }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -input=false
          if [ "${{ inputs.command }}" = "apply" ]; then
            terraform apply -auto-approve -input=false
          else
            terraform plan -no-color -input=false
          fi
