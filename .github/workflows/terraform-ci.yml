name: terraform-ci

on:
  pull_request:
    paths: ["aws/**", "gcp/**", ".github/workflows/terraform-ci.yml"]
  push:
    branches: [main]
    paths: ["aws/**", "gcp/**", ".github/workflows/terraform-ci.yml"]
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud to run the command against"
        required: true
        type: choice
        default: aws
        options: [aws, gcp]
      command:
        description: "Terraform command to run"
        required: true
        type: choice
        default: plan
        options: [plan, apply, destroy]

permissions:
  id-token: write # OIDC to AWS
  contents: read
  pull-requests: write

jobs:
  # --- Static checks: no cloud credentials needed ---------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --chdir=aws
          tflint --chdir=gcp
      - uses: raven-actions/actionlint@v2

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [aws, gcp]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: terraform validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  # --- AWS plan: PR-only, read-only role ------------------------------------
  plan-aws:
    if: github.event_name == 'pull_request'
    needs: [lint, fmt, validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    env:
      # Only required variable without a default; falls back so CI plan
      # works before the repo variable exists.
      TF_VAR_alert_email: ${{ vars.TF_ALERT_EMAIL || 'demo@example.com' }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform plan
        run: |
          cp backend.tf.example backend.tf   # remote state: only CI does this
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -input=false
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync("aws/plan.txt", "utf8");
            const body = "### Terraform plan (aws)\n\n```hcl\n" +
              plan.slice(0, 30000) + "\n```";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # --- AWS apply: main only, apply role ------------------------------------
  apply-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, fmt, validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    env:
      TF_VAR_alert_email: ${{ vars.TF_ALERT_EMAIL || 'demo@example.com' }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform apply
        run: |
          cp backend.tf.example backend.tf   # remote state: only CI does this
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -input=false
          terraform apply -auto-approve -input=false

  # --- AWS manual dispatch: plan/apply/destroy from the Actions UI ----------
  # plan runs with the read-only plan role; apply/destroy run with the apply
  # role (destroy needs the same delete permissions). Dispatch from main:
  # the OIDC trust policies key on the main ref.
  manual-aws:
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.cloud == 'aws' &&
      (inputs.command == 'destroy' ||
       (needs.lint.result == 'success' &&
        needs.fmt.result == 'success' &&
        needs.validate.result == 'success'))
    needs: [lint, fmt, validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    env:
      TF_VAR_alert_email: ${{ vars.TF_ALERT_EMAIL || 'demo@example.com' }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: Debug OIDC claims (temporary, remove after fix)
        run: |
          curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "User-Agent: actions/oidc-client" \
            | jq -r .value | cut -d. -f2 \
            | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.command == 'plan' && vars.AWS_PLAN_ROLE_ARN || vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform ${{ inputs.command }}
        run: |
          cp backend.tf.example backend.tf   # remote state: only CI does this
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -input=false
          case "${{ inputs.command }}" in
            plan)    terraform plan -no-color -input=false ;;
            destroy) terraform destroy -auto-approve -input=false ;;
            *)       terraform apply -auto-approve -input=false ;;
          esac

  # --- GCP: code-first. Jobs self-skip until the GCP variables exist. -------
  # When the GCP account arrives: set GCP_PROJECT_ID / GCP_WIF_PROVIDER /
  # GCP_WIF_SA / GCP_STATE_BUCKET (repository variables) and these jobs light
  # up. See docs/gcp-patching.md.
  gcp:
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.cloud == 'gcp' &&
      vars.GCP_PROJECT_ID != '' &&
      (inputs.command == 'destroy' ||
       (needs.lint.result == 'success' &&
        needs.fmt.result == 'success' &&
        needs.validate.result == 'success'))
    needs: [lint, fmt, validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp
    env:
      # gcp_project_id is required and has no default; feed it to Terraform.
      TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
      - name: terraform ${{ inputs.command }}
        run: |
          cp backend.tf.example backend.tf   # remote state: only CI does this
          terraform init \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -input=false
          case "${{ inputs.command }}" in
            plan)    terraform plan -no-color -input=false ;;
            destroy) terraform destroy -auto-approve -input=false ;;
            *)       terraform apply -auto-approve -input=false ;;
          esac
